<section class="composer" [attr.aria-labelledby]="fieldId('composer-title')">
  <div class="composer-heading">
    <h2 [id]="fieldId('composer-title')">
      {{ parent() ? 'Reply to ' + parent()!.username : 'New comment' }}
    </h2>
    <button class="button quiet" type="button" (click)="cancelled.emit()" [disabled]="submitting()">
      Cancel
    </button>
  </div>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="submitting()">
    <div class="identity-fields">
      <div class="field">
        <label [for]="fieldId('username')">Username</label>
        <input
          #usernameInput
          [id]="fieldId('username')"
          formControlName="username"
          autocomplete="username"
          maxlength="32"
          [attr.aria-invalid]="!!fieldError('username')"
          [attr.aria-describedby]="fieldId('username-error')"
        />
        <span class="field-error" [id]="fieldId('username-error')">{{
          fieldError('username')
        }}</span>
      </div>
      <div class="field">
        <label [for]="fieldId('email')">Email</label>
        <input
          [id]="fieldId('email')"
          type="email"
          formControlName="email"
          autocomplete="email"
          maxlength="254"
          [attr.aria-invalid]="!!fieldError('email')"
          [attr.aria-describedby]="fieldId('email-error')"
        />
        <span class="field-error" [id]="fieldId('email-error')">{{ fieldError('email') }}</span>
      </div>
    </div>
    <div class="field">
      <label [for]="fieldId('text')">Comment</label>
      <textarea
        [id]="fieldId('text')"
        formControlName="text"
        rows="4"
        maxlength="2000"
        placeholder="What's on your mind?"
        [attr.aria-invalid]="!!fieldError('text')"
        [attr.aria-describedby]="fieldId('text-error') + ' ' + fieldId('text-count')"
      ></textarea>
      <div class="text-feedback">
        <span class="field-error" [id]="fieldId('text-error')">{{ fieldError('text') }}</span>
        <span class="muted" [id]="fieldId('text-count')"
          >{{ form.controls.text.value.length }} / 2000</span
        >
      </div>
    </div>
    @if (error()) {
      <p class="error-message" role="alert">{{ error() }}</p>
    }
    <div class="composer-actions">
      <span class="muted">Your username and email will be visible.</span>
      <button class="button primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Posting…' : parent() ? 'Post reply' : 'Post comment' }}
      </button>
    </div>
  </form>
</section>
