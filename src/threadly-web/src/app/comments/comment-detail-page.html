<div class="page-heading">
  <h1>Comment</h1>
  <a class="button secondary" routerLink="/comments">← Back to comments</a>
</div>
<section class="feed" aria-label="Comment detail" [attr.aria-busy]="loading()">
  @if (loading()) {
    <div class="state" role="status">
      <span class="spinner" aria-hidden="true"></span>Loading comment…
    </div>
  } @else if (error()) {
    <div class="state">
      <p class="error-message" role="alert">{{ error() }}</p>
      @if (!notFound()) {
        <button class="button secondary" type="button" (click)="retry()">Try again</button>
      }
    </div>
  } @else if (comment(); as comment) {
    <app-comment-card [comment]="comment" [detail]="true" />
  }
</section>
