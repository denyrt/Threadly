name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore Threadly.slnx
      - run: dotnet build Threadly.slnx --configuration Release --no-restore
      - run: dotnet format Threadly.slnx --verify-no-changes --no-restore
      - name: Check EF Core model matches migrations
        run: dotnet ef migrations has-pending-model-changes --project src/Threadly.Infrastructure --startup-project src/Threadly.Api --context ThreadlyDbContext --configuration Release --no-build
        env:
          ConnectionStrings__threadlydb: Server=localhost;Database=ThreadlyDesign;Integrated Security=True
      - name: Trust HTTPS development certificate for Aspire tests
        run: |
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
      - name: Verify HTTPS development certificate trust
        run: dotnet dev-certs https --check --trust
      # Empty scaffolds still execute every runner. Exit code 8 means that no
      # tests were discovered; other failures remain failures. New tests run
      # automatically without adding another job or changing the solution.
      - run: dotnet test --solution Threadly.slnx --configuration Release --no-build --ignore-exit-code 8

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/threadly-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/threadly-web/.node-version
          cache: npm
          cache-dependency-path: src/threadly-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --file src/Threadly.Api/Dockerfile --tag threadly-api:ci .
      - run: docker build --file src/Threadly.MigrationWorker/Dockerfile --tag threadly-migrations:ci .
      - run: docker build --tag threadly-web:ci src/threadly-web
